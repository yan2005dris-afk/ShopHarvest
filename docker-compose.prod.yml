# ════════════════════════════════════════════════════════════════════════════
#  PRODUCTION compose file (VPS deploy).
#
#  Differs from docker-compose.yml (dev) in three ways:
#    1. Adds a public nginx reverse-proxy that terminates TLS (ports 80/443).
#    2. Adds a certbot sidecar for Let's Encrypt certificate issuance/renewal.
#    3. Hides the backend and both Postgres databases from the host network
#       (no `ports:` blocks for them) — only the reverse-proxy can reach them
#       via the internal `scraper-network`.
#
#  Usage on the VPS:
#    cp .env.example .env   # then edit POSTGRES_PASSWORD, DOMAIN, EMAIL
#    ./deploy/vps-init.sh   # one-shot: bootstraps, pulls images, issues certs
#    docker compose -f docker-compose.prod.yml up -d
#
#  Future deploys (CI/CD via GitHub Actions):
#    ssh user@vps "cd /opt/scraper && git pull && docker compose -f docker-compose.prod.yml up -d --build"
# ════════════════════════════════════════════════════════════════════════════

services:
  # ─── Public-facing reverse proxy (TLS terminator) ─────────────────────────
  #
  # Custom build because we need the entrypoint to run `envsubst` over the
  # nginx template (substituting ${DOMAIN}). alpine-nginx ships without
  # envsubst, so we install it via apk in the proxy Dockerfile.
  proxy:
    build:
      context: .
      dockerfile: docker/Dockerfile.proxy
    container_name: scraper-proxy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mounted as a template; the entrypoint runs envsubst over it and
      # writes the rendered config to /etc/nginx/conf.d/default.conf.
      - ./docker/nginx.prod.conf:/etc/nginx/templates/default.conf.template:ro
      - ./docker/nginx.prod.http.conf:/etc/nginx/conf.d/redirect.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - scraper-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/.well-known/acme-challenge/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Certbot: issues & renews Let's Encrypt certificates ──────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: scraper-certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h; done'"
    # First-time cert issuance is done by deploy/vps-init.sh, NOT here, because
    # the proxy container must already be serving /.well-known/acme-challenge/.
    # This container ONLY renews after the initial cert exists.
    networks:
      - scraper-network

  # ─── Frontend (Angular SPA, served by inner nginx) ────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        # API base URL is baked into the JS bundle at build time.
        # Override per environment by passing a different value to `docker build`.
        API_BASE_URL: ${API_BASE_URL:-/api}
    container_name: scraper-frontend
    restart: unless-stopped
    # No host port: only reachable via the `proxy` upstream.
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - scraper-network

  # ─── Backend (NestJS) ─────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: scraper-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside Docker, hostnames are the service names, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-scraper}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-scraperdb}
      ANALYTICS_DATABASE_URL: postgresql://${POSTGRES_DW_USER:-scraper}:${POSTGRES_DW_PASSWORD}@postgres-dw:5432/${POSTGRES_DW_DB:-scraperdw}
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-https://${DOMAIN}}
      PIPELINE_RAW_DIR: pipeline/raw
      PIPELINE_STAGING_DIR: pipeline/staging
    # No host port: only reachable via the `proxy` upstream.
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-dw:
        condition: service_healthy
    networks:
      - scraper-network

  # ─── Operational Postgres ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: scraper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scraper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-scraperdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scraper} -d ${POSTGRES_DB:-scraperdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scraper-network

  # ─── Data Warehouse Postgres ─────────────────────────────────────────────
  postgres-dw:
    image: postgres:16-alpine
    container_name: scraper-postgres-dw
    restart: unless-stopped
    environment:
      POSTGRES_DW_USER: ${POSTGRES_DW_USER:-scraper}
      POSTGRES_DW_PASSWORD: ${POSTGRES_DW_PASSWORD:?POSTGRES_DW_PASSWORD must be set in .env}
      POSTGRES_DW_DB: ${POSTGRES_DW_DB:-scraperdw}
    volumes:
      - postgres_dw_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_DW_USER:-scraper} -d ${POSTGRES_DW_DB:-scraperdw}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scraper-network


networks:
  scraper-network:
    driver: bridge

volumes:
  postgres_data:
  postgres_dw_data:
  certbot_conf:
  certbot_www: