# ============================================
#  WebScrapingDinamico-Automatico — Deploy
# ============================================
# Runs on the self-hosted runner installed on the VPS
# (deploy/install-runner.sh). On every push to develop,
# pulls the latest code, rebuilds only the changed images,
# and recreates the affected containers without downtime.
#
# Requirements:
#   - Self-hosted runner installed on the VPS (label: self-hosted)
#   - Docker + Docker Compose v2 installed
#   - .env placed in the runner workspace (clean: false preserves it)
#
# Setup (one-time):
#   1. Install runner on VPS: deploy/install-runner.sh
#   2. Copy .env to runner workspace: scp .env user@vps:/opt/scraper/.env
#   3. Push to develop → this workflow deploys automatically
# ============================================

name: Deploy to VPS

on:
  push:
    branches: [develop]
  workflow_dispatch:

# Never cancel an in-flight deploy (would leave the stack half-up).
concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Pull, build, restart on the VPS
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # clean: false keeps the workspace intact between runs so the
          # .env file (with secrets) and the previous build cache survive.
          clean: false

      - name: Ensure .env exists
        run: |
          if [ ! -f .env ]; then
            echo "::error::.env not found in $(pwd)!"
            echo "Copy your .env to the runner workspace first:"
            echo "  scp .env user@vps:/opt/scraper/.env"
            exit 1
          fi
          echo "Found .env ($(wc -l < .env) lines)"

      - name: Pre-pull base images (warms cache)
        # Pulling postgres/cloudflared/nginx from the registry upfront
        # means docker compose build can reuse them as layers instead of
        # redownloading. Big speed-up on the second deploy onward.
        run: |
          docker compose pull --ignore-pull-failures || true

      - name: Rebuild and restart services
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: |
          # --no-deps avoids restarting sibling services. --remove-orphans
          # cleans up containers for services we removed from compose.yaml
          # (e.g. the old proxy/certbot pair when we switched to cloudflared).
          docker compose up -d --build --remove-orphans --no-deps \
            backend frontend cloudflared

      - name: Health check
        run: |
          echo "Waiting 15s for services to settle..."
          sleep 15
          echo ""
          echo "─── Running containers ───"
          docker compose ps --status running
          echo ""
          echo "─── Local API probe (via host port 8080) ───"
          curl -fsSL -o /dev/null -w "GET / → HTTP %{http_code} in %{time_total}s\n" http://localhost:8080/ \
            || echo "::warning::Local probe failed — services may still be starting"

      - name: Clean up dangling images
        # Reclaim disk space from previous <none>-tagged layers after the rebuild.
        run: docker image prune -f