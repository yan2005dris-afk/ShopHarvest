name: Deploy to VPS

# Auto-deploys the production stack to the configured VPS whenever
# code lands on `main`. The workflow SSHes into the VPS, pulls the latest
# commit, rebuilds only the changed images, and recreates the affected
# containers without downtime for the rest of the stack.
#
# Required GitHub repository secrets:
#   VPS_SSH_KEY      — private SSH key authorized in ~/.ssh/authorized_keys on the VPS
#   VPS_HOST         — public hostname or IP of the VPS (e.g. bi.example.com)
#   VPS_USER         — SSH user (e.g. deploy)
#   VPS_DEPLOY_PATH  — absolute path to the clone on the VPS (default /opt/scraper)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (default: HEAD of main)'
        required: false

concurrency:
  group: deploy-vps
  cancel-in-progress: false  # never cancel an in-flight deploy (would leave half-up)

permissions:
  contents: read

jobs:
  deploy:
    name: Pull, build, restart on ${{ vars.VPS_HOST || secrets.VPS_HOST }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS host key to known_hosts (first run)
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Pull + rebuild + restart on the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || 'deploy' }}
        run: |
          set -euo pipefail

          REMOTE="${VPS_USER}@${VPS_HOST}"

          log() { printf "\033[1;34m[deploy]\033[0m %s\n" "$*"; }

          log "Step 1/5 — Pull latest code on the VPS"
          ssh "${REMOTE}" "cd '${VPS_DEPLOY_PATH}' && git fetch --all && git reset --hard origin/main"

          log "Step 2/5 — Sync .env if missing (DO NOT overwrite existing)"
          ssh "${REMOTE}" "
            cd '${VPS_DEPLOY_PATH}'
            if [ ! -f .env ]; then
              echo '[deploy] No .env on the VPS — refusing to deploy.'
              echo '[deploy] Run deploy/vps-init.sh on the VPS first to bootstrap.'
              exit 1
            fi
          "

          log "Step 3/5 — Build only changed images"
          ssh "${REMOTE}" "cd '${VPS_DEPLOY_PATH}' && docker compose -f docker-compose.prod.yml build --pull"

          log "Step 4/5 — Recreate changed services (rolling)"
          # --no-deps: don't restart sibling services. --remove-orphans cleans
          # up services removed from the compose file.
          ssh "${REMOTE}" "
            cd '${VPS_DEPLOY_PATH}'
            docker compose -f docker-compose.prod.yml up -d --no-deps --remove-orphans \
              backend frontend proxy certbot
          "

          log "Step 5/5 — Verify the stack is healthy"
          ssh "${REMOTE}" "
            cd '${VPS_DEPLOY_PATH}'
            docker compose -f docker-compose.prod.yml ps
            echo '---'
            curl -fsSL -o /dev/null -w 'HTTP %{http_code} in %{time_total}s\n' https://${DOMAIN:-localhost}/ || echo 'HTTPS probe failed'
          "

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment to ${{ secrets.VPS_HOST }} failed."
          echo "Check: ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'cd ${{ secrets.VPS_DEPLOY_PATH }} && docker compose -f docker-compose.prod.yml logs --tail=100'"