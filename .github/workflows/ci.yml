name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "11"

jobs:
  # Project-specific sanity checks (demo domains, banned patterns, etc).
  # Kept from the previous CI as-is.
  pipeline-consolidation-guardrails:
    name: Pipeline consolidation guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Demo domain / runtime bridge guardrail
        run: |
          set -e
          # Rule 1: no demo fallback in production code.
          # legacy/ archive is exempt (historical evidence only).
          if rg -n 'quotes\.toscrape\.com|books\.toscrape\.com' backend/src/; then
            echo "::error::demo domain banned in backend/src/"
            exit 1
          fi
          # Rule 2: no ts-node / eval('require') in backend
          if rg -n "ts-node|eval\('require'\)" backend/src/; then
            echo "::error::ts-node or eval('require') in backend"
            exit 1
          fi
          # Rule 3: BrowserFactoryService must not leak into extension adapters
          # (PR 5 enforcement; safe no-op in PR 1a/1b)
          if [ -f backend/src/modules/pipeline/scraping/temu.ts ]; then
            if rg -n 'BrowserFactoryService' \
              backend/src/modules/pipeline/scraping/temu.ts \
              backend/src/modules/pipeline/scraping/shein.ts; then
              echo "::error::BrowserFactoryService in extension adapter"
              exit 1
            fi
          fi

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # Blocks on high/critical advisories across the whole workspace
      # (single lockfile). Moderate/low are noisy and mostly transitive
      # dev-dependency noise — raise/lower --audit-level if you want a
      # stricter or looser bar.
      - name: pnpm audit (high + critical)
        run: pnpm audit --audit-level=high

  contracts:
    name: Contracts (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Lint (tsc --noEmit)
        run: pnpm --filter @web-scraping/contracts lint

      - name: Test
        run: pnpm --filter @web-scraping/contracts test

      - name: Build
        run: pnpm --filter @web-scraping/contracts build

  backend:
    name: Backend (lint, format, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # backend depends on the contracts workspace package's compiled dist.
      - name: Build contracts (dependency)
        run: pnpm --filter @web-scraping/contracts build

      - name: Lint
        run: pnpm --filter backend exec eslint "{src,apps,libs,test}/**/*.ts"

      - name: Format check
        run: pnpm --filter backend exec prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Test
        run: pnpm --filter backend test

      - name: Build
        run: pnpm --filter backend build

  frontend:
    name: Frontend (format, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # frontend depends on the contracts workspace package's compiled dist.
      - name: Build contracts (dependency)
        run: pnpm --filter @web-scraping/contracts build

      # No ESLint config exists for this app yet — format check + the
      # typecheck baked into `ng build` are the lint-equivalent coverage
      # available today.
      - name: Format check
        run: pnpm --filter ./frontend exec prettier --check "src/**/*.ts"

      - name: Test
        run: pnpm --filter ./frontend test

      - name: Build
        run: pnpm --filter ./frontend build

  extension:
    name: Extension (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # No ESLint config exists for the extension yet — tsc --noEmit is
      # the lint-equivalent coverage available today.
      - name: Typecheck
        run: pnpm --filter visual-scraper-extension exec tsc --noEmit -p tsconfig.json

      - name: Test
        run: pnpm --filter visual-scraper-extension test

      - name: Build
        run: pnpm --filter visual-scraper-extension build:chrome
