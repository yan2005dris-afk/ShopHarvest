packages:
  - 'backend'
  - 'frontend'
  - 'extension'
  - 'packages/contracts'

allowBuilds:
  '@nestjs/core': true
  '@prisma/engines': true
  '@parcel/watcher': true
  'prisma': true
  'esbuild': true
  'playwright': true
  'sharp': true
  'lmdb': true
  'msgpackr-extract': true
  'unrs-resolver': true
  better-sqlite3: true
  bcrypt: true
  'class-transformer': true
  'class-validator': true
  '@scarf/scarf': false

overrides:
  tar: '^7.5.19'
  piscina: '^5.1.5'
  fast-uri: '^3.1.5'
  brace-expansion: '^2.1.4'
  js-yaml: '^4.3.1'
  vitest: '^3.2.6'
  vite: '^6.4.3'
  immutable: '^5.1.8'
  multer: '^2.2.0'
  undici: '^7.29.0'
  ip-address: '^10.3.1'
  '@angular/common': '~22.0.2'
