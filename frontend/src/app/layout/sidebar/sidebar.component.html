<!--
  SidebarComponent template.

  Layout follows DESIGN.md §Components/Sidebar:
    - 240px expanded, 64px collapsed (transition handled via
      width utilities bound to ThemeService.sidebarCollapsed()).
    - Brand row at the top, nav in the middle (flex-1), footer
      (theme toggle + extension status) at the bottom.
    - Active link: secondary-container background + primary
      left-border + on-secondary-container text.

  Sub-components used:
    - <app-theme-toggle>     — light/dark theme switch (sidebar footer)
    - <app-extension-status> — /setup link with ON/OFF badge
-->
<aside
  class="sticky top-0 flex h-dvh shrink-0 flex-col border-r border-outline-variant bg-surface-container-low py-4 transition-[width] duration-200"
  [class.w-sidebar]="!themeService.sidebarCollapsed()"
  [class.w-16]="themeService.sidebarCollapsed()"
  [attr.aria-label]="'Primary navigation'"
>
  <!-- Brand row -->
  <header
    class="mb-3 flex items-center gap-2 border-b border-outline-variant px-3 pb-3"
    [class.justify-center]="themeService.sidebarCollapsed()"
  >
    <mat-icon
      class="text-primary"
      aria-hidden="true"
      >radar</mat-icon
    >
    @if (!themeService.sidebarCollapsed()) {
      <div class="flex flex-col leading-tight">
        <span class="text-headline-sm font-bold text-primary"
          >Scraper Studio</span
        >
        <span
          class="text-[10px] uppercase tracking-wider text-on-surface-variant/70"
          >BI Analytics Engine</span
        >
      </div>
    }
  </header>

  <!-- Collapse toggle (top-right of the brand row, always visible on lg+) -->
  <button
    type="button"
    class="absolute right-2 top-3 hidden items-center justify-center rounded-md p-1 text-on-surface-variant transition-colors hover:bg-surface-container-high hover:text-on-surface lg:flex"
    (click)="themeService.toggleSidebar()"
    [attr.aria-label]="
      themeService.sidebarCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'
    "
    [attr.aria-expanded]="!themeService.sidebarCollapsed()"
    data-testid="btn-collapse-sidebar"
    [matTooltip]="themeService.sidebarCollapsed() ? 'Expandir menú' : 'Colapsar menú'"
    matTooltipPosition="right"
  >
    <mat-icon style="font-size: 18px">
      {{
        themeService.sidebarCollapsed() ? 'right_panel_open' : 'left_panel_close'
      }}
    </mat-icon>
  </button>

  <!-- Primary navigation -->
  <nav class="flex-1 space-y-1 px-2" aria-label="Main">
    @for (item of navItems; track item.routerLink) {
      @if (isVisible(item)) {
        <a
          [routerLink]="item.routerLink"
          routerLinkActive="active"
          [routerLinkActiveOptions]="
            item.exact ? { exact: true } : { exact: false }
          "
          class="nav-item group"
          [class.nav-item--collapsed]="themeService.sidebarCollapsed()"
          [attr.data-nav]="item.routerLink"
          [matTooltip]="themeService.sidebarCollapsed() ? item.label : ''"
          matTooltipPosition="right"
        >
          <mat-icon
            class="nav-item__icon"
            aria-hidden="true"
            >{{ item.icon }}</mat-icon
          >
          @if (!themeService.sidebarCollapsed()) {
            <span class="nav-item__label">{{ item.label }}</span>
          }
        </a>
      }
    }
  </nav>

  <!--
    Footer: extension status + theme toggle + logout.

    Layout rationale: the aside is `flex flex-col` with the nav at
    `flex-1`; this footer sits below with `mt-auto` so it always
    hugs the bottom regardless of how long the nav list grows.
    A single 1px border-t with border-outline-variant gives a
    clean separation in both light and dark themes.

    Each row is the .nav-item family (defined in layout.css) — the
    sidebar guarantees identical height/padding by reusing the
    class, so the three rows align vertically without per-row
    overrides.
  -->
  <footer
    class="mt-auto flex flex-col gap-1 border-t border-outline-variant px-2 pt-3"
    aria-label="Sidebar footer"
  >
    <app-extension-status
      [available]="extensionAvailable()"
      [collapsed]="themeService.sidebarCollapsed()"
    />
    <app-theme-toggle [collapsed]="themeService.sidebarCollapsed()" />
    @if (auth.isAuthenticated()) {
      <app-logout [collapsed]="themeService.sidebarCollapsed()" />
    }
  </footer>
</aside>
