<!--
  App shell template.

  Composes the layout primitives (sidebar on the left, main stage
  on the right) and overlays the global toast host. The layout
  primitives each live under src/app/layout/ and own their own
  templates + CSS.

  Component-level CSS (.nav-item family + dim tints) lives in
  src/app/layout/layout.css and is bundled with this template via
  app.ts `styleUrls`.
-->
<div class="flex min-h-dvh bg-background text-on-surface">
  <!--
    Left side-nav. Hidden only on /dashboard while logged out — the
    public BI dashboard is a full-page shell for anonymous visitors
    (see DashboardShellComponent). Authenticated users keep the
    sidebar everywhere, dashboard included.
  -->
  @if (!isDashboardRoute() || auth.isAuthenticated()) {
    <app-sidebar [extensionAvailable]="extensionAvailable" class="block" />
  }

  <!-- Main stage — host for the routed page. -->
  <main class="app-stage min-w-0 flex-1 overflow-auto">
    <router-outlet />
  </main>

  <!-- Global non-blocking toast overlay. -->
  <app-toast-host />
</div>
