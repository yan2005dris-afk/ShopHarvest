<!--
  LoginComponent template — Insight Flow variant.

  Layout: full-viewport grid, single card centered. Card uses
  bg-surface / border-outline-variant per Insight Flow §Elevation.
  Inputs follow the Insight Flow input convention:
    - bg-surface-container-low fill (per .form-group select in the
      ConfirmModal precedent)
    - border-outline-variant by default
    - focus:border-primary + focus:ring-2 focus:ring-primary (the
      "2px Indigo ring" from DESIGN.md §Components/Input Fields)

  The accent/error color comes from --color-danger because the
  legacy accent was already reddish; the system token is what binds
  this to "error / required attention".
-->
<div class="grid min-h-dvh place-items-center p-6 bg-background">
  <mat-card appearance="outlined" class="w-full max-w-sm !p-6">
    <mat-card-header class="!px-0 !pt-0 mb-4">
      <mat-card-title class="!text-2xl !font-bold text-on-surface">{{ title }}</mat-card-title>
      <mat-card-subtitle class="text-on-surface-variant">Visual Scraper</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content class="!px-0">
      <form (ngSubmit)="submit()" class="flex flex-col gap-4">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Email</mat-label>
          <input
            matInput
            type="email"
            name="email"
            autocomplete="username"
            [(ngModel)]="email"
            required
          />
          <mat-icon matPrefix class="mr-2 text-on-surface-variant">email</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Password</mat-label>
          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            name="password"
            [attr.autocomplete]="mode === 'login' ? 'current-password' : 'new-password'"
            [(ngModel)]="password"
            required
          />
          <mat-icon matPrefix class="mr-2 text-on-surface-variant">lock</mat-icon>
          <button
            type="button"
            mat-icon-button
            matSuffix
            (click)="hidePassword = !hidePassword"
            [attr.aria-label]="'Toggle password visibility'"
          >
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        @if (error) {
          <p class="text-body-md m-0 text-danger" data-testid="login-error">{{ error }}</p>
        }

        <button
          mat-flat-button
          color="primary"
          type="submit"
          class="w-full !py-6 !text-base"
          [disabled]="submitting"
          data-testid="login-submit"
        >
          @if (submitting) {
            <span class="flex items-center justify-center gap-2">
              <mat-spinner diameter="20"></mat-spinner>
              <span>Please wait…</span>
            </span>
          } @else {
            {{ title }}
          }
        </button>

        <button
          type="button"
          mat-button
          class="w-full text-on-surface-variant"
          (click)="toggleMode()"
        >
          @if (mode === 'login') {
            Need an account? Register
          } @else {
            Already have an account? Sign in
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
