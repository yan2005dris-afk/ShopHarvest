<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Scraper Studio — Web Scraping Dinámico</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Plataforma de análisis comparativo de precios multi-fuente (UPSE)"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Pre-paint theme bootstrap. Runs synchronously before <body>
         paints, so the correct `dark`/`light` class is on <html> on
         first frame — no FOUC. Mirrors ThemeService's resolve order:
         localStorage 'theme' → prefers-color-scheme → light. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark =
            saved === 'dark'
              ? true
              : saved === 'light'
                ? false
                : window.matchMedia('(prefers-color-scheme: dark)').matches;
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.classList.toggle('light', !dark);
        } catch (_) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>

    <!-- Hanken Grotesk — Insight Flow sole typeface (DESIGN.md §Typography) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Material Icons & Material Symbols Outlined — icon sets for Angular Material & sidebar -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
      rel="stylesheet"
    />
  </head>
  <body class="bg-background text-on-surface">
    <app-root></app-root>
  </body>
</html>
