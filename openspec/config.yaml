project: webscrapingdinamico-automatico
description: >
  Semi-automated visual ETL platform for e-commerce data extraction.
  pnpm workspace monorepo: NestJS 11 API, Angular 22 frontend, Crawlee 3 worker.

context: |
  Monorepo (backend/ frontend/ worker/) with Docker Compose (PostgreSQL 16, RabbitMQ 4).
  NestJS 11 with Prisma 7 + @prisma/adapter-pg for database, amqplib for messaging.
  Angular 22 standalone with application builder, HTTP client, router.
  Worker runs Crawlee 3 + Playwright, consumes RabbitMQ queue.
  pnpm v11 workspace, TypeScript throughout, Prettier + ESLint.

strict_tdd: false
strict_tdd_note: >
  Test runners exist (Jest 30 in backend, Vitest 4 in frontend) but only
  scaffold "Hello World" specs exist. No tests in worker. Strict TDD disabled
  until meaningful test coverage is established.

testing:
  runner_backend:
    framework: jest
    version: "30"
    command: pnpm --filter backend test
  runner_frontend:
    framework: vitest
    version: "4"
    command: pnpm --filter ./frontend test
  layers:
    unit: true
    integration: true
    e2e: true
  coverage:
    available: true
    command_backend: pnpm --filter backend test:cov

quality:
  linter:
    tool: eslint
    version: "9"
    command: pnpm --filter backend lint
  formatter:
    tool: prettier
    version: "3"
    command: pnpm --filter backend format
  type_checker:
    tool: typescript
    version_backend: "5.7"
    version_frontend: "6.0"
    version_worker: "6.0"

commits: none
chained_pr: ask-always
review_budget: 400
artifact_store: openspec

