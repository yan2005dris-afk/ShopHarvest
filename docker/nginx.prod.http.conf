# Plain-HTTP server block: serves the ACME challenge path for certbot AND
# redirects every other request to HTTPS. The proxy container mounts this
# alongside docker/nginx.prod.conf (which is the HTTPS block only).
#
# We split this into a separate file because the HTTPS block needs to know
# the resolved DOMAIN (substituted via envsubst at container start) while the
# HTTP block doesn't.

server {
  listen 80;
  listen [::]:80;
  server_name _;

  # ACME challenge for certbot. Certbot places a token file under
  # /var/www/certbot/.well-known/acme-challenge/<token> and the Let's Encrypt
  # CA fetches it here to prove domain control.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Everything else → HTTPS.
  location / {
    return 301 https://$host$request_uri;
  }
}