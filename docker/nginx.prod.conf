# Public-facing reverse proxy (HTTPS server block).
#
# This file is rendered at container start via `envsubst` — the entrypoint
# substitutes ${DOMAIN} before invoking nginx. See the proxy entrypoint in
# docker-compose.prod.yml.
#
# The HTTP→HTTPS redirect + ACME challenge handler lives in
# docker/nginx.prod.http.conf (separate file, mounted as redirect.conf).
#
# Responsibilities:
#   - Terminate TLS on 443 (certificates mounted from certbot volume)
#   - Serve the Angular SPA from the `frontend` upstream
#   - Forward /api/* to the `backend` upstream
#   - Enforce security headers + gzip + a tiny rate-limit for the API

# Rate-limit zone: 10 req/s per IP for the API, prevents brute-forcing login.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

upstream backend_upstream {
  server backend:3000;
  keepalive 16;
}

upstream frontend_upstream {
  server frontend:80;
  keepalive 16;
}

# HTTPS main server.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;

  server_name ${DOMAIN};

  ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # HSTS: tell browsers to refuse plain HTTP for a year.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # gzip everything text-y.
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml application/xml+rss text/javascript image/svg+xml;
  gzip_min_length 1024;

  # ─── API ───────────────────────────────────────────────────────────────────
  location /api/ {
    limit_req zone=api_limit burst=20 nodelay;

    proxy_pass http://backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # Backend can take a while on ETL runs / report generation.
    proxy_connect_timeout 30s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;
    proxy_buffering       off;

    # Allow large request bodies for batch ingest endpoints.
    client_max_body_size 50m;
  }

  # ─── Static SPA assets (immutable caching) ────────────────────────────────
  location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
    proxy_pass http://frontend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "public, immutable";
    expires 1y;
  }

  # Everything else (Angular routes, /, /dashboard, etc.)
  location / {
    proxy_pass http://frontend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}