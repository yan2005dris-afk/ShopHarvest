# Internal nginx config for the Angular container.
#
# This file is mounted into the frontend container (image: nginx:1.27-alpine)
# and is reached on TWO paths depending on the deployment:
#
# 1. **DEV (docker-compose.yml)**: the browser hits http://localhost:8080/
#    directly, so this nginx needs to proxy /api/* to the backend container
#    in addition to serving the SPA. We do that with `proxy_pass` below.
#
# 2. **PROD (docker-compose.prod.yml)**: the public TLS proxy
#    (docker/nginx.prod.conf) handles /api/* itself, and only forwards
#    `/` and static assets to this container. The /api/ location block
#    is harmless here — the public proxy never forwards those requests
#    to us — but if it ever did (e.g. misconfiguration), this fallback
#    still routes correctly.
#
# The old docker/nginx.conf (now deleted) had this same /api/ block.
# Keeping it here means the same Docker image works in both modes.

upstream backend_upstream {
  server backend:3000;
  keepalive 16;
}

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ─── API proxy (dev + safety-net for prod) ────────────────────────────────
  location /api/ {
    proxy_pass http://backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # Backend ETL runs can be slow; bump the read timeout.
    proxy_connect_timeout 30s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;
    proxy_buffering       off;

    # Allow large request bodies for batch ingest endpoints.
    client_max_body_size 50m;
  }

  # ─── Angular SPA ───────────────────────────────────────────────────────────
  # Hashed bundles under /assets are content-addressed, cache aggressively.
  location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Angular SPA fallback: every unknown route → index.html so the router
  # can take over client-side. NOTE: this must come AFTER the /api/ block
  # so /api/* never falls into the SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Block hidden files (.env, .git, etc.) — defense in depth.
  location ~ /\. {
    deny all;
    return 404;
  }

  # Security headers (the public reverse proxy also adds these in prod).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # gzip for HTML / JSON payloads
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml application/xml+rss text/javascript;
  gzip_min_length 1024;
}