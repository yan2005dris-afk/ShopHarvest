services:
  postgres:
    image: postgres:16-alpine
    container_name: scraper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scraper}
      # POSTGRES_PASSWORD has no fallback. The host .env file MUST define it;
      # a hardcoded "scraperpass" placeholder got GitGuardian-flagged.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-scraperdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scraper} -d ${POSTGRES_DB:-scraperdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scraper-network

  postgres-dw:
    image: postgres:16-alpine
    container_name: scraper-postgres-dw
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_DW_USER:-scraper}
      # No fallback for the password on purpose (same policy as the operational
      # DB): the host .env MUST define POSTGRES_DW_PASSWORD.
      POSTGRES_PASSWORD: ${POSTGRES_DW_PASSWORD:?POSTGRES_DW_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DW_DB:-scraperdw}
    ports:
      - "${POSTGRES_DW_PORT:-5434}:5432"
    volumes:
      - postgres_dw_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_DW_USER:-scraper} -d ${POSTGRES_DW_DB:-scraperdw}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scraper-network

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: scraper-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override DATABASE_URL for Docker networking (localhost doesn't work
      # inside the container).
      DATABASE_URL: postgresql://scraper:${POSTGRES_PASSWORD}@postgres:5432/scraperdb
      ANALYTICS_DATABASE_URL: postgresql://scraper:${POSTGRES_DW_PASSWORD}@postgres-dw:5432/scraperdw
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-dw:
        condition: service_healthy
    networks:
      - scraper-network

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: scraper-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - scraper-network

  etl-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: scraper-etl-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Same as backend: inherits POSTGRES_PASSWORD from .env via env_file.
      CRON_SCHEDULE: ${ETL_CRON_SCHEDULE:-0 2 * * *}
      LOG_LEVEL: ${ETL_LOG_LEVEL:-info}
      NODE_ENV: production
    # REQ-ETL-008: process liveness probe. The worker is a non-HTTP cron
    # process, so the simplest sane check is "did the node process exit 0?"
    # which transitively proves the process is still alive (docker marks the
    # container unhealthy if the process is gone). A heartbeat-file approach
    # is the recommended follow-up but is out of scope for PR 1.
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('ok')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - scraper-network

networks:
  scraper-network:
    driver: bridge

volumes:
  postgres_data:
  postgres_dw_data:
