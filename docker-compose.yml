services:
  postgres:
    image: postgres:16-alpine
    container_name: scraper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scraper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scraperpass}
      POSTGRES_DB: ${POSTGRES_DB:-scraperdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scraper} -d ${POSTGRES_DB:-scraperdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scraper-network

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: scraper-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scraper}:${POSTGRES_PASSWORD:-scraperpass}@postgres:5432/${POSTGRES_DB:-scraperdb}
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - scraper-network

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: scraper-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - scraper-network

  etl-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: scraper-etl-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scraper}:${POSTGRES_PASSWORD:-scraperpass}@postgres:5432/${POSTGRES_DB:-scraperdb}
      CRON_SCHEDULE: ${ETL_CRON_SCHEDULE:-0 2 * * *}
      LOG_LEVEL: ${ETL_LOG_LEVEL:-info}
      NODE_ENV: production
    # REQ-ETL-008: process liveness probe. The worker is a non-HTTP cron
    # process, so the simplest sane check is "did the node process exit 0?"
    # which transitively proves the process is still alive (docker marks the
    # container unhealthy if the process is gone). A heartbeat-file approach
    # is the recommended follow-up but is out of scope for PR 1.
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('ok')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - scraper-network

networks:
  scraper-network:
    driver: bridge

volumes:
  postgres_data:
