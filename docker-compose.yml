services:
  postgres:
    image: postgres:16-alpine
    container_name: scraper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scraper}
      # POSTGRES_PASSWORD has no fallback. The host .env file MUST define it;
      # a hardcoded "scraperpass" placeholder got GitGuardian-flagged.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-scraperdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scraper} -d ${POSTGRES_DB:-scraperdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scraper-network

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: scraper-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inherits POSTGRES_PASSWORD and friends from the .env file (env_file above).
      # DATABASE_URL is left to the backend's own env wiring so we don't
      # duplicate credential material in plain text here.
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - scraper-network

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: scraper-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - scraper-network


networks:
  scraper-network:
    driver: bridge

volumes:
  postgres_data:
